name: flet_practical
description: Unified Flet extension suite bundling Clipboard, Local Notifications, WakeLock, Edge TTS, AutoStart on boot, and In-App Purchases.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flet: ^0.86.5
  flutter:
    sdk: flutter
  pasteboard: ^0.5.0
  flutter_local_notifications: ^22.3.0
  wakelock_plus: ^1.5.2
  launch_at_startup: ^0.5.1
  in_app_purchase: ^3.3.0
  share_plus: ^12.0.1
  flutter_foreground_task: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
